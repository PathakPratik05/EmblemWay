name: Android E2E (Detox)

# Runs the Detox suite on an Android emulator against a backend started with Docker Compose
# (mock OTP + mock maps providers, so no external credentials are needed).
on:
  workflow_dispatch:
  schedule:
    - cron: '30 20 * * *' # nightly, 02:00 IST

jobs:
  detox:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Start backend stack
        run: |
          cp backend/.env.example backend/.env
          POSTGIS_IMAGE=postgis/postgis:16-3.5 docker compose -f infrastructure/docker-compose.yml --profile app up -d --build postgres redis backend
          for i in $(seq 1 60); do curl -sf localhost:3000/api/v1/health/ready && break; sleep 3; done
      - name: Install mobile dependencies
        working-directory: mobile
        run: npm ci
      - name: Build app + test APKs
        working-directory: mobile/android
        run: ./gradlew assembleRelease assembleAndroidTest -DtestBuildType=release -PreactNativeArchitectures=x86_64 --no-daemon
      - name: Run Detox on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          avd-name: EmblemWay_API_35
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          working-directory: mobile
          script: npx detox test -c android.emu.release --headless --record-logs failing --take-screenshots failing
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: detox-artifacts
          path: mobile/e2e/artifacts
