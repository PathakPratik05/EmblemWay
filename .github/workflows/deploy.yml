name: Release & deploy

# Builds versioned images and the signed Android App Bundle. Staging deploys on tags like
# v1.2.3-rc.1; production requires a v1.2.3 tag AND approval on the "production" environment.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emblemway-backend:${{ github.ref_name }}
      - uses: docker/build-push-action@v6
        with:
          context: admin
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/emblemway-admin:${{ github.ref_name }}

  android-bundle:
    runs-on: ubuntu-latest
    env:
      HAS_UPLOAD_KEYSTORE: ${{ secrets.EMBLEMWAY_UPLOAD_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
        working-directory: mobile
      - name: Decode upload keystore
        if: env.HAS_UPLOAD_KEYSTORE == 'true'
        run: echo "${{ secrets.EMBLEMWAY_UPLOAD_KEYSTORE_BASE64 }}" | base64 -d > mobile/android/app/upload.keystore
      - name: Build signed AAB + APK
        working-directory: mobile/android
        env:
          EMBLEMWAY_API_URL: ${{ vars.EMBLEMWAY_API_URL }}
          EMBLEMWAY_MAPS_API_KEY: ${{ secrets.EMBLEMWAY_MAPS_API_KEY }}
          EMBLEMWAY_UPLOAD_STORE_FILE: ${{ env.HAS_UPLOAD_KEYSTORE == 'true' && 'upload.keystore' || '' }}
          EMBLEMWAY_UPLOAD_STORE_PASSWORD: ${{ secrets.EMBLEMWAY_UPLOAD_STORE_PASSWORD }}
          EMBLEMWAY_UPLOAD_KEY_ALIAS: ${{ secrets.EMBLEMWAY_UPLOAD_KEY_ALIAS }}
          EMBLEMWAY_UPLOAD_KEY_PASSWORD: ${{ secrets.EMBLEMWAY_UPLOAD_KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease -PEMBLEMWAY_VERSION_CODE=${{ github.run_number }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: emblemway-android-${{ github.ref_name }}
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/release/*.apk

  deploy-staging:
    if: contains(github.ref_name, '-rc')
    needs: images
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy (platform-specific)
        run: |
          echo "Roll out ghcr.io/${{ github.repository_owner }}/emblemway-backend:${{ github.ref_name }} to staging."
          echo "Run migrations once: docker run --rm -e RUN_MIGRATIONS=true ... emblemway-backend:${{ github.ref_name }} true"
          echo "See docs/DEPLOYMENT_GUIDE.md for the concrete commands for your hosting platform."

  deploy-production:
    if: ${{ !contains(github.ref_name, '-') }}
    needs: [images, android-bundle]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy (platform-specific, requires environment approval)
        run: echo "Promote ${{ github.ref_name }} to production - see docs/DEPLOYMENT_GUIDE.md"
