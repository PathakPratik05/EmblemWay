# EmblemWay local / CI infrastructure.
#   docker compose -f infrastructure/docker-compose.yml up -d postgres redis      (infra only)
#   docker compose -f infrastructure/docker-compose.yml --profile app up -d --build (infra + backend + admin)
name: emblemway

services:
  postgres:
    # Multi-arch PostGIS build (arm64 + amd64). Override with POSTGIS_IMAGE=postgis/postgis:16-3.5 on amd64 if preferred.
    image: ${POSTGIS_IMAGE:-imresamu/postgis:16-3.5}
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-emblemway}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-emblemway_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-emblemway}
    ports:
      - '${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    command: >
      postgres -c max_connections=200 -c shared_buffers=256MB
               -c log_min_duration_statement=500 -c deadlock_timeout=1s
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-emblemway} -d ${POSTGRES_DB:-emblemway}']
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ['redis-server', '/usr/local/etc/redis/redis.conf']
    ports:
      - '${REDIS_HOST_PORT:-6379}:6379'
    volumes:
      - redisdata:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    profiles: ['app']
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ../backend/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-emblemway}:${POSTGRES_PASSWORD:-emblemway_dev_password}@postgres:5432/${POSTGRES_DB:-emblemway}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 3000
    ports:
      - '${BACKEND_HOST_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  admin:
    profiles: ['app']
    build:
      context: ../admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${ADMIN_PUBLIC_API_BASE_URL:-http://localhost:3000/api/v1}
    restart: unless-stopped
    ports:
      - '${ADMIN_HOST_PORT:-3001}:3000'
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
